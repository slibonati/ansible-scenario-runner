---
# Ordered suite for ./run-all.sh. Execution order = list order.
# Paths are relative to this tests/ directory unless absolute.
#
# Per-scenario keys (all optional except name):
#   name              — required; also used for logs and default scenario file
#   scenario / file   — vars file (default: scenarios/<name>.yml)
#   playbook          — override defaults.playbook
#   inventory         — override defaults.inventory
#   vault_file        — override defaults.vault_file
#   verbosity         — 0–5 (override defaults.verbosity)
#   expected_failure  — boolean; match a specific role failure instead of success
#   expected_failure_task — exact failing task name, required when true
#   expected_failure_result — non-empty mapping of result fields to match

defaults:
  playbook: test.yml
  inventory: inventory.yml
  vault_file: vault.yml
  verbosity: 0

scenarios:
  - name: happy-path
  - name: echo-payload
  - name: health-no-auth
  - name: unknown-path
    expected_failure: true
    expected_failure_task: Call authenticated API
    expected_failure_result:
      status: 404
      json:
        error: not_found
        path: /v1/does-not-exist
  - name: happy-path-check
