---
- name: Apply api_client role
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Require scenario_vars extra-var
      ansible.builtin.assert:
        that:
          - scenario_vars is defined
          - (scenario_vars | string | length) > 0
        fail_msg: >-
          scenario_vars is required. Pass a path relative to this playbook
          directory, e.g. -e scenario_vars=scenarios/happy-path.yml
          (or use ./run.sh happy-path). Running test.yml without
          that extra-var is not supported.

    - name: Resolve scenario_vars against playbook_dir
      ansible.builtin.set_fact:
        scenario_vars_file: >-
          {{
            scenario_vars
            if (scenario_vars | string) is match('^/')
            else (playbook_dir ~ '/' ~ (scenario_vars | string))
          }}

    - name: Stat scenario vars file
      ansible.builtin.stat:
        path: "{{ scenario_vars_file }}"
      register: _scenario_vars_stat

    - name: Assert scenario vars file exists
      ansible.builtin.assert:
        that:
          - _scenario_vars_stat.stat.exists | bool
          - _scenario_vars_stat.stat.isreg | bool
        fail_msg: >-
          scenario_vars file not found: {{ scenario_vars_file }}.
          Pass a path relative to the playbook directory
          (e.g. -e scenario_vars=scenarios/happy-path.yml)
          or use ./run.sh happy-path.

    - name: Assert scenario vars file stays under playbook_dir
      ansible.builtin.assert:
        that:
          - >-
            (scenario_vars_file | realpath).startswith(
              (playbook_dir | realpath) ~ '/'
            )
        fail_msg: >-
          scenario_vars must resolve under {{ playbook_dir }}
          (got {{ scenario_vars_file | realpath }}). Paths that escape
          this directory (e.g. ../) are not allowed.

    - name: Load scenario variables
      ansible.builtin.include_vars:
        file: "{{ scenario_vars_file }}"

    - name: Validate scenario check mode
      ansible.builtin.assert:
        that:
          - scenario_check_mode is not defined or scenario_check_mode is boolean
        fail_msg: "scenario_check_mode must be a YAML boolean (true or false)."

    - name: Show scenario execution mode
      ansible.builtin.debug:
        msg: "Role check mode: {{ (scenario_check_mode | default(false)) or ansible_check_mode }}"

  tasks:
    - name: Validate expected failure contract
      ansible.builtin.assert:
        that:
          - scenario_expected_failure | default(false) is boolean
          - not (scenario_expected_failure | default(false)) or (scenario_expected_failure_task | default('') is string and scenario_expected_failure_task | default('') | length > 0)
          - not (scenario_expected_failure | default(false)) or (scenario_expected_failure_result | default({}) is mapping and scenario_expected_failure_result | default({}) | length > 0)
        fail_msg: Expected failures require a task name and non-empty result mapping.

    - name: Initialize failure verification
      ansible.builtin.set_fact:
        _scenario_failure_matched: false

    - name: Execute role and verify an expected failure
      block:
        - name: Invoke role
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/.."
            apply:
              check_mode: "{{ (scenario_check_mode | default(false)) or ansible_check_mode }}"
      rescue:
        - name: Verify the failing task
          ansible.builtin.assert:
            that:
              - scenario_expected_failure | default(false)
              - ansible_failed_task.name == scenario_expected_failure_task
            fail_msg: The role failed unexpectedly or at a different task.

        - name: Verify the failure result
          ansible.builtin.assert:
            that:
              - item.key in ansible_failed_result
              - ansible_failed_result[item.key] == item.value
            fail_msg: The failing task did not return the expected result.
          loop: "{{ scenario_expected_failure_result | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Record verified failure
          ansible.builtin.set_fact:
            _scenario_failure_matched: true

    - name: Reject unexpected success
      ansible.builtin.assert:
        that:
          - not (scenario_expected_failure | default(false)) or _scenario_failure_matched
        fail_msg: The role succeeded but this scenario required a specific failure.

    - name: Write expected failure evidence for the runner
      ansible.builtin.copy:
        dest: "{{ scenario_failure_evidence }}"
        content: matched
        mode: '0600'
      delegate_to: localhost
      check_mode: false
      when:
        - scenario_expected_failure | default(false)
        - scenario_failure_evidence is defined
