---
namespace: demo
name: scenarios
version: 0.1.0
readme: README.md
authors:
  - Contributors
description: >
  Repeatable scenario-based testing for Ansible roles, with ordered suites,
  expected outcomes, and readable execution logs. Includes an API client example.
license:
  - MIT
tags:
  - demo
  - api
  - example
dependencies: {}
repository: "https://github.com/slibonati/ansible-scenario-runner"
documentation: "https://github.com/slibonati/ansible-scenario-runner#readme"
homepage: "https://github.com/slibonati/ansible-scenario-runner"
issues: "https://github.com/slibonati/ansible-scenario-runner/issues"
build_ignore:
  - .git
  - .gitignore
  - .venv
  - 'roles/*/tests/vault.yml'
  - 'roles/*/tests/.vault_pass'
  - 'roles/*/tests/logs/*.log'
  - 'roles/*/tests/mock_api/.mock_api.*'
  - '**/__pycache__'
  - '*.tar.gz'
  - ansible-navigator.log
